version: 2
updates:
  - { package-ecosystem: uv, directory: "/", schedule: { interval: weekly }, groups: { python: { patterns: ["*"] } } }
  - { package-ecosystem: npm, directory: "/web", schedule: { interval: weekly }, groups: { web: { patterns: ["*"] } } }
  - { package-ecosystem: docker, directory: "/", schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: "/", schedule: { interval: weekly } }
  - { package-ecosystem: terraform, directory: "/infra/terraform/aws", schedule: { interval: monthly } }
  - { package-ecosystem: terraform, directory: "/infra/terraform/azure", schedule: { interval: monthly } }
