name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, sign, attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign + provenance
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=edge,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with: { image: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", format: cyclonedx-json, output-file: sbom.cdx.json }
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, GitHub OIDC identity)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attest SBOM
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.build.outputs.digest }}", push-to-registry: true }
      - name: Trivy scan of the pushed image
        uses: aquasecurity/trivy-action@0.29.0
        with: { image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", format: sarif, output: trivy-image.sarif }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-image.sarif, category: trivy-image }

  chart:
    name: Package Helm chart (OCI)
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm dependency build deploy/helm/cloud-copilot
          helm package deploy/helm/cloud-copilot --app-version "${GITHUB_REF_NAME#v}"
          helm push cloud-copilot-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  gitops-staging:
    name: Promote to staging (GitOps)
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main'
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Pin staging to the new digest
        env: { DIGEST: "${{ needs.image.outputs.digest }}" }
        run: |
          sed -i "s|^  digest: .*|  digest: \"${DIGEST}\"|" deploy/environments/staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(staging): ${DIGEST:7:12} [skip ci]" || echo "no change"
          git push
