groups:
  - name: cloud-copilot
    rules:
      - alert: CriticalCloudFindings
        expr: sum(copilot_findings{severity="CRITICAL"}) > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $value }} critical cloud misconfigurations open"
          description: "Open the Cloud Copilot dashboard → Findings → severity CRITICAL."
      - alert: PostureScoreDropped
        expr: delta(copilot_posture_score[1d]) < -10
        labels: { severity: ticket }
        annotations: { summary: "Posture score dropped by more than 10 points in 24h" }
      - alert: ScannerErrors
        expr: increase(copilot_service_errors_total[1h]) > 0
        labels: { severity: ticket }
        annotations: { summary: "Scanner {{ $labels.provider }}:{{ $labels.service }} failing (permissions?)" }
      - alert: NoRecentScan
        expr: time() - max(copilot_scan_duration_seconds_created) > 2 * 86400
        labels: { severity: ticket }
        annotations: { summary: "No scan in the last 48h" }
      - alert: LLMErrorRateHigh
        expr: |
          sum(rate(copilot_llm_requests_total{outcome="error"}[15m]))
            / clamp_min(sum(rate(copilot_llm_requests_total[15m])), 1e-9) > 0.5
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "More than half of LLM calls fail (copilot running in offline mode)" }
      - alert: ApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(copilot_http_request_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "API p95 latency above 2s" }
