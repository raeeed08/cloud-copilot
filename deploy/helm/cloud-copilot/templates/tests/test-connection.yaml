apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cc.fullname" . }}-test
  labels: {{- include "cc.labels" . | nindent 4 }}
  annotations: { "helm.sh/hook": test, "helm.sh/hook-delete-policy": hook-succeeded }
spec:
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      args: ["-fsS", "http://{{ include "cc.fullname" . }}:{{ .Values.service.port }}/readyz"]
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
