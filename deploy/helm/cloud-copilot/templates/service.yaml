apiVersion: v1
kind: Service
metadata:
  name: {{ include "cc.fullname" . }}
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
  selector: {{- include "cc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
