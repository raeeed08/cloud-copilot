{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.fullname" . }}
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cc.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
        {{- end }}
        - podSelector: {}
      ports:
        - { port: 8000, protocol: TCP }
        - { port: {{ .Values.mcp.port }}, protocol: TCP }
  egress:
    # DNS
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    # cloud APIs, LLM provider and PostgreSQL (HTTPS / 5432)
    - ports: [{ port: 443, protocol: TCP }, { port: 5432, protocol: TCP }]
{{- end }}
