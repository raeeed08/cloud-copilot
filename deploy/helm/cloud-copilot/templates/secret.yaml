{{- if .Values.secrets.create }}
{{- /* SECRET_KEY encrypts stored credentials: generate once, then keep it across upgrades via lookup */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cc.fullname" .) }}
{{- $key := "" }}
{{- if and $existing (index ($existing.data | default dict) "SECRET_KEY") }}
{{- $key = index $existing.data "SECRET_KEY" | b64dec }}
{{- else }}
{{- $key = randBytes 32 | b64enc | replace "+" "-" | replace "/" "_" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cc.fullname" . }}
  labels: {{- include "cc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SECRET_KEY: {{ default $key .Values.secrets.values.SECRET_KEY | quote }}
  {{- range $k, $v := .Values.secrets.values }}
  {{- if ne $k "SECRET_KEY" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cc.fullname" . }}
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "cc.secretName" . }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
